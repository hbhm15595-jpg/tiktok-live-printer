<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MO7 TADY — Live Typewriter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--paper:#f7f0df;--ink:#28241c;--lime:#c5ed98}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080a09;color:#f7f5ec;font-family:'Noto Sans Arabic',sans-serif}body{display:grid;place-items:center;overflow:hidden}.frame{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;overflow:hidden;background:radial-gradient(ellipse at 50% 32%,#35372e,#151711 57%,#090a08);container-type:size}.top{position:absolute;z-index:8;top:3.5%;left:5%;right:5%;display:flex;justify-content:space-between;align-items:flex-start}.brand{direction:ltr;letter-spacing:.17em;font:600 2.2cqw 'IBM Plex Mono',monospace}.brand small{display:block;margin-top:.4em;color:#aab09f;font-size:1cqw;letter-spacing:.12em}.live{display:flex;align-items:center;gap:.6em;border:1px solid #ff6c5d66;background:#351614b0;border-radius:99px;padding:.5em .8em;font:600 1.05cqw 'IBM Plex Mono';letter-spacing:.09em}.dot{width:.55em;height:.55em;border-radius:50%;background:#ff6259;box-shadow:0 0 10px #f44}.leader{position:absolute;z-index:9;top:10%;left:4%;width:28%;padding:1cqw 1.1cqw;border:1px solid #ffffff26;border-radius:1.4cqw;background:#10130fdc;backdrop-filter:blur(8px)}.leader-title{display:flex;justify-content:space-between;font-size:1.17cqw;color:#e6e4d9;margin-bottom:.5cqw}.leader-title b{color:var(--lime)}.leader-row{display:grid;grid-template-columns:1.5cqw 1fr auto;gap:.4cqw;align-items:center;border-top:1px solid #ffffff18;padding:.42cqw 0;font-size:1.02cqw}.rank,.leader-count{direction:ltr;font:500 .95cqw 'IBM Plex Mono';color:#c9c7b9}.leader-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.machine{position:absolute;left:5%;right:5%;top:18%;height:69%;overflow:hidden;border-radius:3cqw;background:radial-gradient(ellipse at 50% 40%,#30312a,#141510 65%,#090a08);box-shadow:0 2cqw 8cqw #000b,inset 0 0 2cqw #ffffff10}.paper{position:absolute;z-index:3;top:5%;left:22%;width:56%;height:48%;padding:2.4cqw 2cqw 1cqw;background:linear-gradient(100deg,#e8dfca,#fff9e9 18%,#f8f2e3 80%,#e6ddc8);color:var(--ink);box-shadow:0 1cqw 2cqw #000a,inset 0 0 2cqw #95866755;transform:perspective(80cqw) rotateX(1deg);overflow:hidden}.paper:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 2px,#806e4e 3px,transparent 4px 7px)}.paper-title{position:relative;z-index:1;text-align:center;direction:ltr;border-bottom:1px dashed #857961;padding-bottom:.7cqw;margin-bottom:.7cqw;color:#625944;font:600 1.1cqw 'IBM Plex Mono';letter-spacing:.12em}.feed{position:relative;z-index:1;height:calc(100% - 2.5cqw);overflow:auto;scrollbar-width:none;direction:rtl}.feed::-webkit-scrollbar{display:none}.entry{padding:.55cqw .15cqw .7cqw;border-bottom:1px dashed #8d806866;animation:stamp .12s ease-out}.entry-head{display:flex;justify-content:space-between;gap:.4cqw;align-items:baseline;font-size:1.07cqw;font-weight:800;color:#554b39}.entry-time{direction:ltr;white-space:nowrap;color:#8d8069;font:.75cqw 'IBM Plex Mono'}.entry-text{min-height:1.5em;color:#211d17;font-size:1.62cqw;line-height:1.52;font-weight:700;overflow-wrap:anywhere;text-shadow:0 0 .07em #211d1788}.entry-text:after{content:'';display:inline-block;width:.11em;height:1em;vertical-align:-.12em;background:#29251d;animation:blink .7s steps(1) infinite}.entry.done .entry-text:after{display:none}@keyframes blink{50%{opacity:0}}@keyframes stamp{from{opacity:.35;filter:blur(.4px)}to{opacity:1;filter:none}}.platen{position:absolute;z-index:2;top:51%;left:12%;right:12%;height:5.4%;border-radius:99px;background:linear-gradient(#e1d7bf 0%,#686455 18%,#191a15 45%,#4a493f 72%,#c5baa1 100%);box-shadow:0 .7cqw 1cqw #000b,inset 0 .2cqw .4cqw #fff8}.platen:before,.platen:after{content:'';position:absolute;top:-12%;width:8%;height:124%;border-radius:50%;background:radial-gradient(ellipse at 38% 35%,#e0d7c2,#5f5c4e 50%,#171813 75%);box-shadow:0 .2cqw .5cqw #000}.platen:before{left:-3%}.platen:after{right:-3%}.rail{position:absolute;z-index:2;top:56.5%;left:10%;right:10%;height:.8cqw;border-radius:99px;background:linear-gradient(#d4c9ab,#535044 45%,#d0c5ab);box-shadow:0 .3cqw .6cqw #000a}.carriage{position:absolute;z-index:4;top:54.6%;right:15%;width:5%;height:3.5%;border:1px solid #ded3b6;border-radius:.45cqw;background:linear-gradient(145deg,#d1c5a8,#555246 60%,#171813);box-shadow:0 .4cqw .6cqw #000b;transition:right .08s linear}.carriage.returning{animation:returnCarriage .34s ease-in-out}@keyframes returnCarriage{0%{right:72%}76%{right:7%}100%{right:15%}}.ribbon{position:absolute;z-index:3;top:59%;left:17%;right:17%;height:1.1cqw;border-radius:99px;background:linear-gradient(90deg,#29221d 0 44%,#873d32 45% 54%,#211d19 55%);box-shadow:0 .35cqw .5cqw #000c,inset 0 .1cqw .15cqw #fff6}.typebar{position:absolute;z-index:5;top:68%;left:50%;width:.8cqw;height:19%;border-radius:99px;background:linear-gradient(90deg,#171813,#d6c9aa 45%,#615b4b 72%,#141510);transform-origin:50% 100%;transform:rotate(26deg);box-shadow:0 0 .35cqw #fff7}.typebar.strike{animation:strike .12s ease-out}@keyframes strike{0%{transform:rotate(26deg)}45%{transform:rotate(-25deg) translateY(-1cqw)}100%{transform:rotate(26deg)}}.machine-body{position:absolute;z-index:2;left:5%;right:5%;bottom:-2%;height:39%;border-radius:42% 42% 8% 8% / 24% 24% 8% 8%;background:linear-gradient(165deg,#47473e 0%,#24251f 28%,#11120f 80%);box-shadow:0 -1cqw 2cqw #000c,inset 0 .8cqw 1cqw #ffffff18,inset 0 -1cqw 2cqw #000}.machine-body:before{content:'';position:absolute;left:9%;right:9%;top:14%;height:15%;border-radius:50%;background:linear-gradient(#aaa087,#514e42 40%,#1b1c17 78%);box-shadow:inset 0 .45cqw .8cqw #000a,0 .4cqw .8cqw #000}.keybed{position:absolute;z-index:6;left:15%;right:15%;bottom:7%;display:flex;justify-content:center;gap:1.1cqw;perspective:24cqw}.key{width:4.25cqw;height:3cqw;display:grid;place-items:center;border:1px solid #c2b598;border-radius:50%;color:#e3dac3;font:500 .8cqw 'IBM Plex Mono';background:radial-gradient(ellipse at 34% 24%,#726b58,#302f28 58%,#11120f 82%);box-shadow:0 .65cqw .35cqw #050605,inset 0 .22cqw .3cqw #fff6;transform:rotateX(28deg);transition:transform .055s,filter .055s}.key.hit{transform:translateY(.5cqw) rotateX(18deg);filter:brightness(1.7)}.return-lever{position:absolute;z-index:7;right:9%;top:65%;width:2cqw;height:14%;border-radius:99px;background:linear-gradient(90deg,#171813,#d8ccb1,#464337);transform:rotate(24deg);transform-origin:bottom;box-shadow:0 0 .4cqw #0009}.return-lever.pull{animation:leverPull .32s ease-out}@keyframes leverPull{0%{transform:rotate(24deg)}50%{transform:rotate(-10deg)}100%{transform:rotate(24deg)}}.bar{position:absolute;z-index:12;bottom:4%;left:5%;right:5%;display:flex;justify-content:center;gap:.65cqw;opacity:0;transition:opacity .2s}.frame:hover .bar,.bar:focus-within{opacity:1}.bar button{border:1px solid #ffffff44;background:#111d;color:#fff;border-radius:99px;padding:.6cqw .9cqw;font:1cqw 'Noto Sans Arabic';cursor:pointer}.bar button:hover{border-color:var(--lime)}.bar .on{color:var(--lime)}.status{position:absolute;z-index:11;bottom:1.2%;left:5%;right:5%;text-align:center;color:#a5a797;font:.85cqw 'IBM Plex Mono';direction:ltr}.toast{position:absolute;z-index:13;left:50%;top:66%;transform:translate(-50%,10px);opacity:0;transition:.3s;background:#142016ed;border:1px solid #c5ed98a0;padding:1.1cqw 2cqw;border-radius:1.2cqw;text-align:center;width:76%}.toast.show{opacity:1;transform:translate(-50%,0)}.toast b{display:block;color:var(--lime);font-size:2cqw}.toast span{font-size:1.2cqw}@media(max-aspect-ratio:9/16){.frame{width:100vw;height:177.7778vw;max-height:100vh}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="frame" id="frame">
 <header class="top"><div class="brand">MO7 TADY<small>LIVE MECHANICAL TYPEWRITER</small></div><div class="live"><i class="dot"></i><span id="live-label">DEMO MODE</span></div></header>
 <aside class="leader"><div class="leader-title"><span>قادة التكبيس</span><b>♥ LIVE</b></div><div id="leaders"></div></aside>
 <section class="machine" id="machine">
  <div class="paper"><div class="paper-title">MO7 TADY  •  LIVE COMMENTS</div><div class="feed" id="feed"></div></div>
  <div class="platen"></div><div class="rail"></div><div class="carriage" id="carriage"></div><div class="ribbon"></div><div class="typebar" id="typebar"></div><div class="return-lever" id="return-lever"></div>
  <div class="machine-body"></div><div class="keybed" id="keybed"></div>
 </section>
 <div class="toast" id="toast"><b id="toast-title">شكراً على ١٠٠ تكبيسة</b><span id="toast-sub"></span></div>
 <div class="status" id="status">OFFLINE · DEMO READY</div>
 <nav class="bar" aria-label="التحكم"><button id="sound">🔇 تفعيل الصوت العربي</button><button id="demo-comment">＋ تعليق تجريبي</button><button id="demo-gift">🎁 هدية</button><button id="demo-like">♥ تكبيس</button><button id="connect">اتصال بالخادم</button></nav>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),feed=$('#feed');
let soundOn=false,socket=null,leaders=new Map(),commentQueue=[],typing=false,likeBuckets=new Map(),audioCtx,speechQueue=[],speaking=false,arabicFemaleVoice=null;
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chooseArabicFemaleVoice(){if(!('speechSynthesis'in window))return;const voices=speechSynthesis.getVoices(),arabic=voices.filter(v=>/^ar([_-]|$)/i.test(v.lang)),female=/female|sara|sarah|zariyah|hoda|salma|amira|laila|layla|maha|reem|noor|noura|fatima|maryam|arwa|leena|yasmin|yasmine/i;arabicFemaleVoice=arabic.find(v=>female.test(v.name))||arabic.find(v=>!(/maged|majed|tarik|hamed|omar|khalid/i.test(v.name)))||arabic[0]||null}
if('speechSynthesis'in window){chooseArabicFemaleVoice();speechSynthesis.addEventListener('voiceschanged',chooseArabicFemaleVoice)}
function speak(text){if(!soundOn||!('speechSynthesis'in window))return;speechQueue.push(String(text));speakNext()}
function speakNext(){if(speaking||!speechQueue.length||!soundOn)return;const text=speechQueue.shift(),u=new SpeechSynthesisUtterance(text);u.lang=arabicFemaleVoice?.lang||'ar-SA';if(arabicFemaleVoice)u.voice=arabicFemaleVoice;u.rate=1.08;u.pitch=1.12;u.volume=1;speaking=true;u.onend=u.onerror=()=>{speaking=false;speakNext()};speechSynthesis.speak(u)}
function clack(){try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=150+Math.random()*110;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.04,audioCtx.currentTime+.004);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.04);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.045)}catch{}}
const keyLabels=['ا','ل','م','ح','ب','ر','ي','ك','ت','و','ن','س'],keyNodes=[];
for(const label of keyLabels){const key=document.createElement('i');key.className='key';key.textContent=label;$('#keybed').append(key);keyNodes.push(key)}
function hitMachine(i,char){const key=keyNodes[(i+char.codePointAt(0))%keyNodes.length],bar=$('#typebar');key.classList.add('hit');bar.classList.remove('strike');void bar.offsetWidth;bar.classList.add('strike');if(soundOn)clack();setTimeout(()=>key.classList.remove('hit'),90);const carriage=$('#carriage');if(i%26===0&&i>0){carriage.classList.remove('returning');void carriage.offsetWidth;carriage.classList.add('returning');$('#return-lever').classList.remove('pull');void $('#return-lever').offsetWidth;$('#return-lever').classList.add('pull');setTimeout(()=>{carriage.classList.remove('returning');carriage.style.right='15%';$('#return-lever').classList.remove('pull')},350)}else carriage.style.right=Math.min(72,15+i*2.15)+'%'}
function addComment({nickname='مشاهد',comment='',uniqueId=''}){commentQueue.push({nickname,comment,uniqueId});typeNext()}
function typeNext(){if(typing||!commentQueue.length)return;typing=true;const c=commentQueue.shift(),entry=document.createElement('article');entry.className='entry';const head=document.createElement('div');head.className='entry-head';const name=document.createElement('span');name.textContent=c.nickname+(c.uniqueId?' · @'+c.uniqueId:'');const time=document.createElement('time');time.className='entry-time';time.textContent=new Date().toLocaleTimeString('en-GB');head.append(name,time);const body=document.createElement('div');body.className='entry-text';entry.append(head,body);feed.append(entry);feed.scrollTop=feed.scrollHeight;speak(`${c.nickname} يقول: ${c.comment}`);let i=0;const chars=Array.from(String(c.comment));const timer=setInterval(()=>{if(i>=chars.length){clearInterval(timer);entry.classList.add('done');typing=false;$('#carriage').classList.remove('returning');$('#carriage').style.right='15%';$('#return-lever').classList.remove('pull');feed.scrollTop=feed.scrollHeight;setTimeout(typeNext,260);return}const char=chars[i++];body.textContent+=char;if(char.trim())hitMachine(i,char);feed.scrollTop=feed.scrollHeight},42)}
function renderLeaders(){const rows=[...leaders].sort((a,b)=>b[1]-a[1]).slice(0,5);$('#leaders').innerHTML=rows.length?rows.map(([n,c],i)=>`<div class="leader-row"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="leader-name">${safe(n)}</span><span class="leader-count">${c}</span></div>`).join(''):'<div class="leader-row"><span class="rank">01</span><span class="leader-name">بانتظار التفاعل</span><span class="leader-count">—</span></div>'}
function like({nickname='مشاهد',uniqueId='',likeCount=1}){const id=uniqueId||nickname,n=Math.max(1,Number(likeCount)||1),b=likeBuckets.get(id)||{count:0,fired:false,timer:0};b.count+=n;clearTimeout(b.timer);b.timer=setTimeout(()=>likeBuckets.delete(id),3200);leaders.set(nickname,(leaders.get(nickname)||0)+n);renderLeaders();if(b.count>=100&&!b.fired){b.fired=true;showHundred(nickname)}likeBuckets.set(id,b)}
function showHundred(n){$('#toast-title').textContent='شكراً على ١٠٠ تكبيسة';$('#toast-sub').textContent=n;$('#toast').classList.add('show');speak(`${n}، شكراً على مئة تكبيسة`);setTimeout(()=>$('#toast').classList.remove('show'),4200)}
function gift({nickname='مشاهد',giftName='هدية',repeatCount=1}){$('#toast-title').textContent='🎁 '+giftName;$('#toast-sub').textContent=nickname;$('#toast').classList.add('show');speak(`${nickname} أرسل ${giftName}${repeatCount>1?'، '+repeatCount+' مرات':''}`);setTimeout(()=>$('#toast').classList.remove('show'),3200)}
$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊 الصوت العربي مفعّل':'🔇 تفعيل الصوت العربي';$('#sound').classList.toggle('on',soundOn);if(soundOn){audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume?.();chooseArabicFemaleVoice();speak('تم تفعيل الصوت العربي')}else{speechQueue=[];speechSynthesis?.cancel();speaking=false}};
$('#demo-comment').onclick=()=>addComment({nickname:'Noura',uniqueId:'noura_live',comment:['يا سلام على البث!','من الرياض أتابعك 💚','استمر يا بطل'][Math.floor(Math.random()*3)]});$('#demo-gift').onclick=()=>gift({nickname:'Fahad',giftName:'وردة'});$('#demo-like').onclick=()=>like({nickname:'Layan',uniqueId:'layan_88',likeCount:25});
$('#connect').onclick=()=>{if(socket?.connected){socket.disconnect();socket=null;$('#live-label').textContent='DEMO MODE';$('#status').textContent='OFFLINE · DEMO READY';return}const url=prompt('عنوان الخادم (مثال: http://localhost:3000)','http://localhost:3000');if(!url)return;if(!window.io){const s=document.createElement('script');s.src=url.replace(/\/$/,'')+'/socket.io/socket.io.js';s.onload=()=>connectSocket(url);s.onerror=()=>alert('تعذر تحميل Socket.IO. شغّل الخادم ثم أعد المحاولة.');document.head.append(s)}else connectSocket(url)};
function connectSocket(url){try{socket=window.io(url,{transports:['websocket','polling']});socket.on('connect',()=>{$('#live-label').textContent='CONNECTED';$('#status').textContent='CONNECTED · '+url});socket.on('disconnect',()=>{$('#live-label').textContent='DEMO MODE';$('#status').textContent='DISCONNECTED'});socket.on('status',s=>$('#status').textContent=(s.status||'').toUpperCase());socket.on('chat',addComment);socket.on('gift',gift);socket.on('like',like)}catch{$('#status').textContent='CONNECTION ERROR'}}
renderLeaders();window.MO7Overlay={addComment,like,gift};if(location.protocol==='file:')setTimeout(()=>addComment({nickname:'معاينة',comment:'الآلة تطبع التعليق حرفًا حرفًا'}),500);
})();
</script>
</body>
</html>
